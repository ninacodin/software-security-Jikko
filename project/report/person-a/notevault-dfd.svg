<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">NoteVault — Data-Flow Diagram (Term Project, Team Jikko)</text>

  <!-- Zones -->
  <rect x="20" y="60" width="290" height="500" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="165" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">Internet (untrusted)</text>

  <rect x="365" y="60" width="615" height="500" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="672" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">Server host / container (trusted)</text>

  <!-- Trust boundary TB1 (network perimeter) -->
  <line x1="337" y1="58" x2="337" y2="545" stroke="#dc2626" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="337" y="562" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">TB1 — Internet / Server (network perimeter)</text>

  <!-- External entities -->
  <g font-size="13" fill="#0f172a">
    <rect x="55" y="187" width="190" height="56" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="150" y="220" text-anchor="middle" font-weight="600">Anonymous visitor</text>

    <rect x="55" y="312" width="190" height="56" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="150" y="345" text-anchor="middle" font-weight="600">Authenticated user</text>

    <rect x="55" y="452" width="190" height="56" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="150" y="485" text-anchor="middle" font-weight="600">Admin</text>
  </g>

  <!-- Process P1 -->
  <rect x="430" y="185" width="185" height="290" rx="92" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="522" y="315" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">P1</text>
  <text x="522" y="337" text-anchor="middle" font-size="13" fill="#14532d">NoteVault</text>
  <text x="522" y="357" text-anchor="middle" font-size="13" fill="#14532d">Flask app + API</text>

  <!-- Process P2 (export subprocess) -->
  <rect x="760" y="168" width="190" height="80" rx="40" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="855" y="203" text-anchor="middle" font-size="13" font-weight="700" fill="#713f12">P2: export subprocess</text>
  <text x="855" y="223" text-anchor="middle" font-size="12" fill="#713f12">OS command (echo …)</text>

  <!-- Data store D1 (SQLite) -->
  <g>
    <path d="M763,430 a92,15 0 0 0 184,0 v75 a92,15 0 0 1 -184,0 z" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8"/>
    <ellipse cx="855" cy="430" rx="92" ry="15" fill="#e2e8f0" stroke="#64748b" stroke-width="1.8"/>
    <text x="855" y="472" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">D1: SQLite DB</text>
    <text x="855" y="491" text-anchor="middle" font-size="12" fill="#334155">users (creds, role), notes</text>
  </g>

  <!-- Trust boundary TB3 (shell/exec) -->
  <line x1="700" y1="168" x2="700" y2="255" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="700" y="158" text-anchor="middle" font-size="11" font-weight="700" fill="#dc2626">TB3 — shell/exec boundary</text>
  <text x="700" y="273" text-anchor="middle" font-size="10" fill="#dc2626">Cmd injection risk: /export</text>

  <!-- Trust boundary TB2 (SQL) -->
  <line x1="700" y1="360" x2="700" y2="500" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="700" y="350" text-anchor="middle" font-size="11" font-weight="700" fill="#dc2626">TB2 — SQL boundary</text>
  <text x="700" y="516" text-anchor="middle" font-size="10" fill="#dc2626">SQLi risk: /login, /search</text>

  <!-- Flows -->
  <g fill="none" stroke="#334155" stroke-width="1.5">
    <!-- F1 anon -> P1 (horizontal) -->
    <line x1="245" y1="218" x2="428" y2="220" marker-end="url(#arrow)"/>
    <!-- F2 P1 -> auth (session response, upper) -->
    <line x1="430" y1="324" x2="249" y2="330" marker-end="url(#arrow)"/>
    <!-- F3/F4/F5 auth -> P1 (request, lower) -->
    <line x1="245" y1="356" x2="428" y2="350" marker-end="url(#arrow)"/>
    <!-- F6 admin -> P1 (request, upper) -->
    <line x1="245" y1="465" x2="428" y2="420" marker-end="url(#arrow)"/>
    <!-- F6 P1 -> admin (users+hashes response, lower) -->
    <line x1="430" y1="440" x2="249" y2="495" marker-end="url(#arrow)"/>
    <!-- P1 -> P2 -->
    <line x1="612" y1="250" x2="758" y2="218" marker-end="url(#arrow)"/>
    <!-- P1 -> D1 -->
    <line x1="612" y1="400" x2="761" y2="428" marker-end="url(#arrow)"/>
  </g>

  <!-- Flow labels -->
  <g font-size="11" fill="#1e293b" font-weight="600">
    <text x="360" y="206" text-anchor="middle">F1 login / register</text>
    <text x="338" y="316" text-anchor="middle" fill="#2563eb">F2 session JWT</text>
    <text x="337" y="374" text-anchor="middle">F3/F4/F5 notes · search · export</text>
    <text x="340" y="430" text-anchor="middle">F6 admin request</text>
    <text x="340" y="502" text-anchor="middle" fill="#b91c1c">F6 users + hashes</text>
    <text x="685" y="245" text-anchor="middle">argv / stdout</text>
    <text x="685" y="405" text-anchor="middle">SQL / rows</text>
  </g>

  <!-- Legend (bottom strip) -->
  <g font-size="11" fill="#475569">
    <rect x="40" y="582" width="920" height="44" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="58" y="609" font-weight="700" fill="#0f172a">Legend</text>
    <rect x="120" y="598" width="16" height="12" fill="#dbeafe" stroke="#3b82f6"/><text x="143" y="608">External entity</text>
    <rect x="270" y="598" width="16" height="12" rx="6" fill="#dcfce7" stroke="#16a34a"/><text x="293" y="608">Process</text>
    <ellipse cx="438" cy="604" rx="8" ry="5" fill="#e2e8f0" stroke="#64748b"/><text x="455" y="608">Data store</text>
    <line x1="560" y1="604" x2="588" y2="604" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/><text x="598" y="608">Data flow</text>
    <line x1="690" y1="604" x2="716" y2="604" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3"/><text x="724" y="608" fill="#dc2626">Trust boundary (Supawan scope)</text>
  </g>
</svg>
